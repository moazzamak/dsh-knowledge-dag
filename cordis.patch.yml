# The bundle patch: one row, the knowledge DAG.
#
# The store is the only setting. The adapter behind it takes a path
# and nothing else, so a second source (the model's own knowledge
# base) is another path rather than another plugin.
#
# `store`/`pages` are relative to `workspace` when a profile names one, and
# to the host process's working directory when it does not. Name the
# workspace in a profile patch: a CLI started in the project happens to have
# that directory as its cwd, but the Desktop application starts its host in
# the profile directory, where the same relative path resolves to nothing.
- insert:
    - id: knowledge-dag
      name: dsh-knowledge-dag
      config:
        store: analysis/graph/nodes
        pages: analysis/nodes
        # workspace: C:/path/to/the/project
